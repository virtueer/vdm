name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build and release (e.g. v1.0.0)'
        required: true

permissions:
  contents: write

env:
  GO_VERSION: '1.25'
  NODE_VERSION: '22'
  PNPM_VERSION: '11'
  WAILS_VERSION: 'v3.0.0-beta.3'

jobs:
  linux:
    name: Linux (amd64)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: desktop/go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - run: npm install -g pnpm@${{ env.PNPM_VERSION }}

      - name: Install GTK4 / WebKitGTK build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libgtk-4-dev libwebkitgtk-6.0-dev

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@${{ env.WAILS_VERSION }}

      - name: Stamp the release version
        run: ./.github/scripts/set-version.sh "${{ inputs.tag || github.ref_name }}"

      - name: Build binary, deb and rpm
        working-directory: desktop
        run: |
          wails3 task linux:build
          wails3 task linux:create:deb
          wails3 task linux:create:rpm

      - name: Assemble the portable archive
        working-directory: desktop
        run: |
          stage="vdm-linux-amd64"
          mkdir -p "$stage"
          cp bin/vdm "$stage/vdm"
          cp build/appicon.png "$stage/vdm.png"
          cp build/linux/vdm.desktop "$stage/vdm.desktop"
          cp build/linux/install.sh "$stage/install.sh"
          chmod +x "$stage/vdm" "$stage/install.sh"
          tar czf "$stage.tar.gz" "$stage"

      - name: Collect artifacts
        run: |
          mkdir -p dist
          cp desktop/vdm-linux-amd64.tar.gz dist/
          cp desktop/bin/vdm.deb dist/vdm-linux-amd64.deb
          cp desktop/bin/vdm.rpm dist/vdm-linux-x86_64.rpm

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*

  windows:
    name: Windows (amd64)
    runs-on: windows-latest
    env:
      # go-sqlite3 is a cgo package, and the Wails task defaults to CGO_ENABLED=0.
      CGO_ENABLED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: desktop/go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - run: npm install -g pnpm@${{ env.PNPM_VERSION }}

      - name: Ensure a C toolchain
        shell: bash
        run: |
          if ! command -v gcc >/dev/null 2>&1; then
            choco install mingw -y --no-progress
          fi
          gcc --version

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@${{ env.WAILS_VERSION }}

      - name: Stamp the release version
        shell: bash
        run: ./.github/scripts/set-version.sh "${{ inputs.tag || github.ref_name }}"

      - name: Build
        shell: bash
        working-directory: desktop
        run: wails3 task windows:build

      - name: Collect artifacts
        shell: bash
        run: |
          mkdir -p dist
          cp desktop/bin/vdm.exe dist/vdm-windows-amd64.exe

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*

  macos:
    # One universal (arm64 + amd64) bundle, built on Apple Silicon: the Intel
    # runner image is no longer offered, and lipo covers both architectures.
    name: macOS (universal)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: desktop/go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - run: npm install -g pnpm@${{ env.PNPM_VERSION }}

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@${{ env.WAILS_VERSION }}

      - name: Stamp the release version
        run: ./.github/scripts/set-version.sh "${{ inputs.tag || github.ref_name }}"

      - name: Build the universal app bundle
        working-directory: desktop
        run: wails3 task darwin:package:universal

      - name: Collect artifacts
        run: |
          mkdir -p dist
          ditto -c -k --keepParent desktop/bin/vdm.app dist/vdm-macos-universal.zip

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/*

  release:
    name: Publish release
    needs: [linux, windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          ls -la dist
          gh release create "$TAG" dist/* \
            --repo "${{ github.repository }}" \
            --title "VDM $TAG" \
            --generate-notes
