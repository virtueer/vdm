<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024"
     role="img" aria-label="Video Download Manager">
  <defs>
    <linearGradient id="surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2E2E34"/>
      <stop offset="1" stop-color="#17171A"/>
    </linearGradient>
  </defs>

  <!-- app surface: the same zinc stack the UI uses -->
  <rect x="32" y="32" width="960" height="960" rx="224" fill="url(#surface)"/>
  <rect x="36.5" y="36.5" width="951" height="951" rx="219.5" fill="none" stroke="#52525B" stroke-width="9"/>

  <!-- download arrow -->
  <rect x="452" y="188" width="120" height="300" rx="60" fill="#FAFAFA"/>
  <path d="M312 430h400a20 20 0 0 1 15 33L527 700a20 20 0 0 1-30 0L297 463a20 20 0 0 1 15-33z" fill="#FAFAFA"/>

  <!-- progress bar, in the accent tone used for active downloads -->
  <rect x="284" y="782" width="456" height="96" rx="48" fill="#38BDF8"/>
</svg>
