<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <link rel="stylesheet" href="popup.css">
</head>

<body>
    <div class="header">
        <h2>Found Videos</h2>
    </div>
    <div id="video-list">
        <div class="empty">No videos found.</div>
    </div>


    <!-- Info Modal -->
    <div id="info-modal" class="modal">
        <div class="modal-content">
            <span class="close-info-btn close-btn">&times;</span>
            <div style="padding: 10px;">
                <h3 style="margin-top:0;">m3u8 Download Info</h3>
                <p style="font-size:13px;">This is a (.m3u8) live stream or video chunk file. Chrome cannot download this directly.</p>
                <p style="font-size:13px;">Please copy the command below and download it using <b>yt-dlp</b> and <b>aria2</b>.</p>
                <textarea id="m3u8-link-text" readonly
                    style="width: 100%; height: 60px; margin-bottom: 10px; padding: 5px; box-sizing: border-box;"></textarea>
                <div class="action-buttons">
                    <button id="copy-m3u8-btn" class="btn-copy">Copy Link</button>
                </div>
            </div>
        </div>
    </div>

    <script src="popup.js"></script>
</body>

</html>
